<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-LKB Harian UIN Kediri</title>
  <link rel="icon" href="data:;base64,iVBORw0KGgo="> 
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .fab { position: fixed; bottom: 2rem; right: 2rem; z-index: 40; }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); transform: scale(0.95); }
      70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); transform: scale(1); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); transform: scale(0.95); }
    }
    .recording-pulse { animation: pulse-ring 1.5s infinite; }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-20">

  <!-- VIEW: SETUP KONEKSI -->
  <div id="view-setup" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md border border-emerald-100">
      <div class="text-center mb-6">
        <h1 class="text-3xl font-bold text-emerald-700 tracking-tight">E-LKB</h1>
        <p class="text-sm font-medium text-slate-500 mt-1">UIN Syekh Wasil Kediri</p>
      </div>
      <form id="formSetup" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">URL Web App (GAS)</label>
          <input type="url" id="apiUrl" placeholder="https://script.google.com/.../exec" required class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password Aplikasi</label>
          <input type="password" id="apiPwd" placeholder="Masukkan password keamanan" required class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none shadow-sm">
        </div>
        <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3.5 rounded-xl hover:bg-emerald-700 shadow-lg transition-transform transform hover:-translate-y-0.5">Mulai Aplikasi</button>
      </form>
    </div>
  </div>

  <!-- VIEW: DASHBOARD APLIKASI -->
  <div id="view-app" class="hidden">
    <!-- Navbar -->
    <nav class="bg-emerald-700 text-white px-6 py-4 shadow-md flex justify-between items-center sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <i class="fas fa-clipboard-check text-2xl"></i>
        <div>
          <h1 class="font-bold text-lg leading-tight">LKB Harian</h1>
          <p class="text-xs text-emerald-200" id="navUser">Memuat profil...</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="cetakLaporan()" class="bg-emerald-800 hover:bg-emerald-900 px-3 py-2 rounded-lg text-sm font-bold shadow transition"><i class="fas fa-print"></i> <span class="hidden sm:inline ml-1">Cetak PDF</span></button>
        <button onclick="logout()" class="text-emerald-200 hover:text-white p-2" title="Keluar"><i class="fas fa-sign-out-alt text-lg"></i></button>
      </div>
    </nav>

    <div class="max-w-5xl mx-auto p-4 mt-2">
      <!-- Toolbar Filter -->
      <div class="bg-white p-4 rounded-xl shadow-sm mb-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border border-slate-200">
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <label class="font-bold text-sm text-slate-600"><i class="far fa-calendar-alt mr-1 text-emerald-600"></i> Pilih Bulan:</label>
          <input type="month" id="filterBulan" onchange="loadData()" class="border border-slate-300 px-3 py-2 rounded-lg text-sm font-semibold focus:ring-2 focus:ring-emerald-500 w-full sm:w-auto shadow-sm cursor-pointer">
        </div>
      </div>

      <!-- Tabel -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left">
            <thead class="bg-emerald-50 text-emerald-900 border-b border-emerald-100 uppercase text-xs">
              <tr>
                <th class="p-4 font-bold w-32">Tanggal</th>
                <th class="p-4 font-bold">Deskripsi Kegiatan</th>
                <th class="p-4 font-bold w-36 text-center">Kategori</th>
                <th class="p-4 font-bold w-28 text-center">Output</th>
                <th class="p-4 font-bold w-16 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100">
              <tr><td colspan="5" class="p-8 text-center text-slate-400">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Floating Button -->
    <button onclick="bukaModal()" class="fab bg-emerald-600 hover:bg-emerald-700 text-white w-14 h-14 rounded-full shadow-xl flex justify-center items-center text-2xl transition transform hover:scale-105 hover:rotate-90">
      <i class="fas fa-plus"></i>
    </button>
  </div>

  <!-- MODAL INPUT -->
  <div id="modal-input" class="fixed inset-0 bg-slate-900 bg-opacity-60 flex items-center justify-center hidden z-50 p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-lg overflow-hidden relative">
      <div class="flex justify-between items-center pb-3 border-b border-slate-100 mb-4">
        <h3 class="font-bold text-lg text-emerald-800" id="modalTitle">Tambah Kegiatan Baru</h3>
        <button onclick="tutupModal()" class="text-slate-400 hover:text-red-500 text-2xl leading-none">&times;</button>
      </div>

      <input type="hidden" id="editRowId">
      <div class="mb-4">
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Tanggal Pelaksanaan</label>
        <input type="date" id="inTgl" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-medium focus:ring-2 focus:ring-emerald-500">
      </div>

      <!-- TABS -->
      <div class="flex gap-2 mb-5 bg-slate-100 p-1.5 rounded-xl">
        <button id="tabVoi" onclick="switchTab('voi')" class="w-1/2 py-2 bg-white shadow-sm rounded-lg text-xs font-bold text-emerald-700 transition flex justify-center items-center gap-1.5"><i class="fas fa-wand-magic-sparkles"></i> AI & Suara</button>
        <button id="tabMan" onclick="switchTab('man')" class="w-1/2 py-2 text-xs font-bold text-slate-500 rounded-lg transition hover:text-slate-700 flex justify-center items-center gap-1.5"><i class="fas fa-keyboard"></i> Manual</button>
      </div>

      <!-- AREA AI -->
      <div id="areaVoi" class="space-y-4">
        <div class="flex flex-col items-center justify-center py-5 bg-emerald-50/50 rounded-xl border border-dashed border-emerald-200">
          <button id="btnMic" onclick="toggleMic()" class="w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 text-2xl shadow-sm flex items-center justify-center transition focus:outline-none">
            <i class="fas fa-microphone"></i>
          </button>
          <p id="micStatus" class="text-xs font-semibold text-emerald-700 mt-3 text-center px-4">Ketuk mikrofon untuk mulai mendikte</p>
        </div>
        <textarea id="aiTeks" rows="3" placeholder="Hasil suara akan muncul di sini. Anda juga bisa mengetik cerita kegiatan bebas di sini..." class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500"></textarea>
        <button onclick="simpan('ai')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition flex justify-center items-center gap-2"><i class="fas fa-bolt"></i> Analisis AI & Simpan</button>
      </div>

      <!-- AREA MANUAL -->
      <div id="areaMan" class="space-y-4 hidden">
        <textarea id="manDesc" rows="3" placeholder="Deskripsi resmi..." class="w-full border border-slate-300 rounded-xl p-3 text-sm focus:ring-2 focus:ring-emerald-500"></textarea>
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-1">
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Judul</label>
            <select id="manJudul" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-emerald-500">
              <option value="-">-</option><option value="Perkuliahan">Perkuliahan</option><option value="Rapat">Rapat</option>
              <option value="Bimbingan">Bimbingan</option><option value="Validasi">Validasi</option><option value="Sosialisasi">Sosialisasi</option>
              <option value="Seminar">Seminar</option><option value="Maintenance">Maintenance</option><option value="Evaluasi">Evaluasi</option>
              <option value="Bahan Ajar">Bahan Ajar</option><option value="Pengabdian">Pengabdian</option><option value="Penelitian">Penelitian</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Jml</label>
            <input type="number" id="manJml" value="1" min="1" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Satuan</label>
            <select id="manSat" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm bg-white focus:ring-2 focus:ring-emerald-500">
              <option value="Kegiatan">Kegiatan</option><option value="Kelas">Kelas</option><option value="Mahasiswa">Mahasiswa</option><option value="Materi">Materi</option><option value="-">-</option>
            </select>
          </div>
        </div>
        <button onclick="simpan('man')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-md transition mt-2"><i class="fas fa-save mr-1"></i> Simpan Data Manual</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    const $ = id => document.getElementById(id);
    let recognition = null;
    let isRecording = false;

    // FUNGSI FETCH KE GOOGLE APPS SCRIPT
    async function api(action, payload = {}) {
      const url = localStorage.getItem('lkb_url');
      const pwd = localStorage.getItem('lkb_pwd');
      
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // text/plain menghindari CORS error
        body: JSON.stringify({ password: pwd, action, payload })
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error);
      return json.data;
    }

    // INIT
    window.onload = () => {
      const today = new Date();
      const ds = today.toISOString().slice(0, 10);
      $('filterBulan').value = ds.slice(0, 7);
      $('inTgl').value = ds;

      setupSpeech();

      if (localStorage.getItem('lkb_url') && localStorage.getItem('lkb_pwd')) {
        $('view-setup').classList.add('hidden');
        $('view-app').classList.remove('hidden');
        loadData();
        api('getProfile').then(p => $('navUser').innerText = `${p.nama} (${p.nip})`).catch(e=>{});
      }
    };

    // SETUP KONEKSI
    $('formSetup').onsubmit = (e) => {
      e.preventDefault();
      localStorage.setItem('lkb_url', $('apiUrl').value.trim());
      localStorage.setItem('lkb_pwd', $('apiPwd').value.trim());
      location.reload();
    };

    function logout() {
      localStorage.clear();
      location.reload();
    }

    // LOAD DATA TABEL
    async function loadData() {
      const tbody = $('tableBody');
      const bulan = $('filterBulan').value;
      tbody.innerHTML = '<tr><td colspan="5" class="p-10 text-center text-slate-500"><i class="fas fa-circle-notch fa-spin text-2xl text-emerald-500 mb-2"></i><br>Membaca Google Sheets...</td></tr>';
      
      try {
        const data = await api('getLogs', { bulan });
        if (!data.length) {
          tbody.innerHTML = '<tr><td colspan="5" class="p-12 text-center text-slate-400"><i class="fas fa-folder-open text-4xl mb-3 block"></i>Belum ada catatan bulan ini.</td></tr>';
          return;
        }
        tbody.innerHTML = data.map(r => `
          <tr class="hover:bg-emerald-50/60 transition group">
            <td class="p-4 font-semibold text-slate-700 whitespace-nowrap">${r.tanggal}</td>
            <td class="p-4 text-slate-800 leading-relaxed">${r.deskripsi}</td>
            <td class="p-4 text-center"><span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-md text-xs font-bold">${r.judul}</span></td>
            <td class="p-4 text-center font-medium text-slate-600">${r.jml} <span class="text-xs text-slate-400">${r.satuan}</span></td>
            <td class="p-4 text-center">
              <button onclick='bukaModalEdit(${JSON.stringify(r)})' class="text-blue-500 hover:text-blue-700 p-2 rounded-lg hover:bg-blue-50 transition opacity-0 group-hover:opacity-100"><i class="fas fa-pen"></i></button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-red-500 font-bold bg-red-50">${err.message}</td></tr>`;
      }
    }

    // MODAL & TAB
    function bukaModal() {
      $('editRowId').value = '';
      $('modalTitle').innerText = 'Tambah Kegiatan Baru';
      $('inTgl').disabled = false;
      $('aiTeks').value = ''; $('manDesc').value = '';
      switchTab('voi');
      $('modal-input').classList.remove('hidden');
    }

    function bukaModalEdit(r) {
      $('editRowId').value = r.row;
      $('modalTitle').innerText = `Edit: ${r.tanggal}`;
      $('inTgl').value = r.tanggalRaw;
      $('inTgl').disabled = true;
      $('manDesc').value = r.deskripsi; $('manJudul').value = r.judul;
      $('manJml').value = r.jml; $('manSat').value = r.satuan;
      switchTab('man');
      $('modal-input').classList.remove('hidden');
    }

    function tutupModal() { stopMic(); $('modal-input').classList.add('hidden'); }

    function switchTab(m) {
      const v = m === 'voi';
      $('areaVoi').classList.toggle('hidden', !v); $('areaMan').classList.toggle('hidden', v);
      $('tabVoi').className = v ? 'w-1/2 py-2 bg-white shadow-sm rounded-lg text-xs font-bold text-emerald-700 transition flex justify-center items-center gap-1.5' : 'w-1/2 py-2 text-xs font-bold text-slate-500 rounded-lg transition hover:text-slate-700 flex justify-center items-center gap-1.5';
      $('tabMan').className = !v ? 'w-1/2 py-2 bg-white shadow-sm rounded-lg text-xs font-bold text-blue-700 transition flex justify-center items-center gap-1.5' : 'w-1/2 py-2 text-xs font-bold text-slate-500 rounded-lg transition hover:text-slate-700 flex justify-center items-center gap-1.5';
      if (!v) stopMic();
    }

    // WEB SPEECH API
    function setupSpeech() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { $('btnMic').disabled = true; $('micStatus').innerText = 'Browser tdk mendukung mic.'; return; }
      
      recognition = new SR();
      recognition.lang = 'id-ID';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isRecording = true;
        $('btnMic').classList.replace('bg-emerald-100', 'bg-red-500');
        $('btnMic').classList.replace('text-emerald-600', 'text-white');
        $('btnMic').classList.add('recording-pulse');
        $('micStatus').innerHTML = '<span class="text-red-500 font-bold">Mendengarkan... (Ketuk utk stop)</span>';
      };

      recognition.onresult = e => {
        let final = '', interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) final += e.results[i][0].transcript;
          else interim += e.results[i][0].transcript;
        }
        const box = $('aiTeks');
        if (final) box.value = (box.value + " " + final.trim()).trim();
      };

      recognition.onerror = () => stopMic();
      recognition.onend = () => { if (isRecording) recognition.start(); };
    }

    function toggleMic() {
      if (!recognition) return;
      if (isRecording) stopMic();
      else { isRecording = true; recognition.start(); }
    }

    function stopMic() {
      isRecording = false; if (recognition) recognition.stop();
      const btn = $('btnMic');
      btn.classList.replace('bg-red-500', 'bg-emerald-100');
      btn.classList.replace('text-white', 'text-emerald-600');
      btn.classList.remove('recording-pulse');
      $('micStatus').innerText = 'Ketuk mikrofon untuk mendikte';
    }

    // SIMPAN & CETAK
    async function simpan(mode) {
      stopMic();
      const tgl = $('inTgl').value;
      const id = $('editRowId').value;
      if (!tgl) return alert("Pilih tanggal!");
      
      let payload = { tanggal: tgl, mode: mode, editRow: id ? parseInt(id,10) : null };

      if (mode === 'ai') {
        if (!$('aiTeks').value.trim()) return alert("Suara/teks kosong.");
        payload.teksSuara = $('aiTeks').value.trim();
      } else {
        if (!$('manDesc').value.trim()) return alert("Isi deskripsi.");
        payload.manualData = { deskripsi: $('manDesc').value.trim(), judul: $('manJudul').value, jml: parseInt($('manJml').value)||1, satuan: $('manSat').value };
      }

      tutupModal();
      Swal.fire({title: mode==='ai'?'AI Merangkum...':'Menyimpan...', allowOutsideClick: false, didOpen: ()=>Swal.showLoading()});

      try {
        const res = await api('saveLog', payload);
        Swal.fire('Sukses', `Data tersimpan: ${res.judul}`, 'success');
        
        const mo = tgl.substring(0,7);
        if ($('filterBulan').value !== mo) $('filterBulan').value = mo;
        loadData();
      } catch (err) {
        Swal.fire('Error', err.message, 'error');
      }
    }

    async function cetakLaporan() {
      const bulan = $('filterBulan').value;
      Swal.fire({title: 'Membuat PDF...', allowOutsideClick: false, didOpen: ()=>Swal.showLoading()});
      try {
        const res = await api('printLog', { bulan });
        Swal.close();
        const w = window.open('', '_blank');
        w.document.write(res.html); w.document.close();
        setTimeout(() => { w.print(); }, 800);
      } catch (err) {
        Swal.fire('Error Cetak', err.message, 'error');
      }
    }
  </script>
</body>
</html>
